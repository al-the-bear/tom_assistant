name: tom_brain_smoke_prototype
description: End-to-end smoke harness for the Tom Brain prototype — the higher assembly that boots a whole cognition (stub substrate + in-isolate memory) and stands the access process up on a local port. Lives above the access / procedure / substrate / memory packages so it may legally wire them together.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.10.8

# Why this project exists (Plan step E.46 / `prototype_implementation_plan.md`
# § E.10 — End-to-end smoke).
#
# The access prototype (`tom_brain_access`) is forbidden to import
# `tom_brain_substrate` / `tom_brain_memory` (its pubspec scope discipline +
# `dependency_surface_test.dart`). It therefore receives an *already-booted*
# cognition through the `BrainProvisioner` seam, whose CLI default refuses —
# only "a higher assembly (Tom Assistant integration, or a test) that may
# legally import substrate + memory" can supply a real provisioner (see
# `brain_provisioner.dart`).
#
# `tom_brain_smoke_prototype` is that higher assembly for the prototype's own
# end-to-end smoke. It sits above all four brain packages and is the *only*
# place that wires them together: it boots `BrainProcessBoot` (which imports
# substrate + memory), projects the resulting `RunCoordinator` onto a
# `QueueSnapshot`, hands back a `ProvisionedBrain`, and calls
# `startBrainAccessProcess` to bind the OpenAI + `/healthz` socket on a local
# port. Keeping this wiring in its own package is what lets the access package
# stay free of the forbidden imports while the smoke still exercises the real
# boot path.
#
#   - tom_brain_access — the running process: `startBrainAccessProcess`,
#                                   `ProvisionedBrain`, `QueueSnapshot`,
#                                   `AccessConfig`, the edge-security policies.
#   - tom_brain_procedure — `BrainProcessBoot` / `BrainProcessConfig`
#                                   (boots substrate → memory → engine →
#                                   dispatcher), `MemoryProvisioningConfig`,
#                                   `Dispatcher`, `RunCoordinator`.
#   - tom_brain_substrate         — `TomBrainSubstrateClient` + the LLM/embed
#                                   value types the stub substrate implements.
#   - tom_brain_memory            — `TomBrainMemory` + `MemoryConfig` for the
#                                   in-isolate memory double + its factory.
#   - tom_brain_shared            — the cross-component vocabulary (`Vec`,
#                                   `NodeId`, the id types, `WriteBudget`).
#   - tom_basics                  — workspace baseline (`tomLog`); hosted to
#                                   keep the resolver consistent with the rest
#                                   of the closure.
dependencies:
  tom_brain_access:
    path: ../tom_brain_access
  tom_brain_procedure:
    path: ../tom_brain_procedure
  tom_brain_substrate:
    path: ../tom_brain_substrate
  tom_brain_memory:
    path: ../tom_brain_memory
  tom_brain_shared:
    path: ../tom_brain_shared
  # Generic, domain-free agentic building blocks. The process bench's
  # nearest-rank percentile maths + `LatencySummary` live here (the same maths
  # the memory package's recall-latency tracker derives), so the bench consumes
  # them rather than carrying its own copy.
  tom_core_agentic:
    path: ../../tom_ai/core/tom_core_agentic
  # The E.58 process bench is a CLI entry point, so its arg parsing
  # (`--samples` / `--warmup` / `--output`), `--version`, and `--help` are built
  # on the shared `tom_build_base` framework rather than hand-rolled — the
  # workspace rule that every CLI tool consumes that parser.
  tom_build_base: ">=2.6.25"
  tom_basics: ">=1.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  # The Telegram smoke (E.49) injects a loopback `ChatApi` double through the
  # access process's `TelegramChatApiFactory` seam. The double `implements
  # ChatApi`, so the test layer needs `tom_chattools`; production code does not.
  tom_chattools: ">=1.0.2"
  # The OpenAI conformance suite (E.53) drives the running process over a real
  # TCP socket with `tom_core_kernel`'s HTTP client (`TomServerChannel` /
  # `TomServerCall`) — the plan names this client by name. Test-only: the
  # production process binds the socket, it never speaks to itself as a client.
  tom_core_kernel:
    path: ../../tom_ai/core/tom_core_kernel
  # `tom_core_kernel`'s HTTP client delegates socket I/O to
  # `TomPlatformUtils.current.httpClient()`. In a standalone test process the
  # default is the fallback (which throws `UnimplementedError`), so the E.53
  # suite registers the standalone (`dart:io`) platform — `IOClient` — once in
  # `setUpAll`. Test-only.
  tom_basics_console: ">=1.0.0"
  # The E.55 end-to-end conformance suite inspects the post-run memory graph
  # *through the memory MCP server* (the brain's real external memory-inspection
  # surface). It stands `TomBrainMemoryMcpServer` up over an in-memory
  # `StreamChannel<String>` pair and drives it with a real `dart_mcp` client in
  # the same isolate. Test-only: production wiring exposes the MCP server through
  # its own transport; the smoke speaks to it as an embedded client.
  dart_mcp: ^0.5.0
  stream_channel: ^2.1.4
