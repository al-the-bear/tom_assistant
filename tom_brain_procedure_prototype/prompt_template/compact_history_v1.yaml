# compact_history_v1 — conversation-history compaction prompt template
# (Plan step G.21; hub spec § 22.4).
#
# Compaction is itself a substrate call, expressed as a prompt template so it
# is auditable and rewritable like every other prompt. The engine-side
# `HistoryCompactor` loads this template, injects the two history placeholders,
# and asks the model to rewrite the running summary so it folds in the new
# batch — staying within the model config's maxCompactedTokens / maxCompactedChars
# (hub § 22.6b). An over-long result is re-run once with a tightening directive,
# then hard-truncated to the char bound with a `history.compaction.truncated`
# note.
#
# The assistant-dedication anchor (PE-7) is applied by the substrate when the
# call is made (hub § 22.4, "runs under the same anchor"), not via a template
# placeholder — so this template carries only the two history placeholders.
#
# Role `history_compactor` is specified here; its RoleTemplate registration in
# tom_brain_substrate is pending (the prototype's locked 5-role roster is
# attestation-protected). The template loader does not resolve the role at load
# (it binds at the live call path, G.23), so the artifact is usable now.

id: compact_history_v1
role: history_compactor

models:
  - { config: gemma_4_26b, provider: omlx }
  - { config: gemma_4_26b, provider: ollama }

# Compaction proposes nothing and calls nothing — it only rewrites prose.
tools: []
toolPolicy: explicit

system: |
  You maintain a running summary of a conversation between a user and their
  assistant. Rewrite the summary so it incorporates the information from the
  new turns, keeping it concise, factual, and faithful to both sides. Preserve
  durable facts, decisions, names, and open threads; drop pleasantries and
  redundancy. Output only the rewritten summary.

  Current summary (may be empty on the first compaction):
  ${history.compacted}

user: |
  New turns to fold into the summary:
  ${history.batch}
