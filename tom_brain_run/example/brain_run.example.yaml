# yaml-language-server: $schema=../../../.tom/json-schema/tom_brain/brain_run.schema.json
# Example whole-process run config for the tom_brain prototype.
#
# Consumed by two launchers, both reading this one file:
#   * tom_brain_run/bin/brain_serve.dart       — substrate + memory + access
#   * tom_brain_memory/bin/memory_mcp_server.dart — the `memory:` section only
#
# `${env:NAME}` references are expanded from the launching process's environment
# (memory.root, memory.sqliteVec.binariesRoot, access.telegram.botToken, and
# each user's openaiBearerTokens). Copy this file, fill in real values (or set
# the env vars), and pass the copy as the launcher's argument.

# ── Substrate: where tokens actually come from ───────────────────────────────
substrate:
  providers:
    - id: omlx
      kind: openai          # oMLX exposes an OpenAI-compatible endpoint
      baseUrl: ${env:TOM_BRAIN_OMLX_BASE_URI}      # e.g. http://10.8.0.7:8000/
      models:
        - ${env:TOM_BRAIN_OMLX_MODEL}              # e.g. gemma-4-26b-a4b-it-4bit
    - id: ollama
      kind: ollama
      baseUrl: ${env:TOM_BRAIN_OLLAMA_BASE_URI}    # e.g. http://127.0.0.1:11434/
      models:
        - ${env:TOM_BRAIN_OLLAMA_EMBED_MODEL}      # e.g. nomic-embed-text
  roleRoutes:
    assistant_to_user:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    # Extension-H retrieval roles — routed to the same substrate as the
    # assistant. The retrieval conductor's `recall_*` legs call these via
    # `sub.retrievalRole(...)`; an unrouted role makes that leg degrade to no
    # seeds (PE-6), so leaving these out silently weakens recall.
    recall_planner:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    hypothesis_writer:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    query_term_writer:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    category_selector:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    retrieval_reranker:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    profile_selector:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    # Core thinking-loop roles. `prompt_analyzer_v1` dispatches `analyser`;
    # `answer_with_thinking_v1` dispatches `analyser`, `sub_thinker`,
    # `assistant_to_user` (above), and `evaluator`. An unrouted role throws
    # `RoleNotFound` on the first dispatch, so these are mandatory for the
    # thinking loop. `recaller` / `researcher` complete the core roster.
    analyser:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    sub_thinker:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    recaller:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    evaluator:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    researcher:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    # Procedure-authoring roles (`author_new_procedure_v1`).
    procedure_author:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    procedure_critic:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    procedure_selector:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    # Creation-loop roles (`create_v1`).
    creator:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    tester:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    reviewer:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    # Planning-loop roles (`plan_v1`).
    planner:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    decomposer:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    estimator:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    plan_evaluator:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    re_planner:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    # Dreaming-agent roles (`dream_*_v1`, gated by the `dream:` block — off by
    # default).
    extractor:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    connector:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    synthesiser:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    inquisitor:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    pruner:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    reconsolidator:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
    repetition_detector:
      - providerId: omlx
        model: ${env:TOM_BRAIN_OMLX_MODEL}
  embedding:
    providerId: ollama
    model: ${env:TOM_BRAIN_OLLAMA_EMBED_MODEL}
    dims: 768
    normalize: true

# ── Memory: the on-disk knowledge graph + the packaged vec0 binary ───────────
memory:
  root: ${env:TOM_BRAIN_MEMORY_ROOT}               # a writable directory; created if absent
  sqliteVec:
    binariesRoot: ${env:TOM_BINARIES_ROOT}/sqlite_vec   # holds <platform>/vec0.<ext>

# ── History: per-lane conversation/activity-history sizing — OPTIONAL ─────────
# A TOP-LEVEL block (hub spec § 22.6b/c), distinct from the nested
# `access.history.directory` below (which only sets the durable history path).
# The four knobs resolve per lane as `lane override -> defaults -> code default
# (HistorySizing.standard())`; `rawCount` has a hard floor of 10 (a value below
# 10 is rejected, not clamped). Omit the whole block to take the code defaults.
# Validates against .tom/json-schema/tom_brain/history.schema.json (wired via the
# brain_run.schema.json modeline at the top of this file).
history:
  defaults:
    rawCount: 10                # verbatim turns always kept (floor 10)
    compactionThreshold: 40     # pending turns behind the window that trigger compaction
    maxCompactedTokens: 1024    # upper bound on the compacted summary, in tokens
    maxCompactedChars: 6000     # upper bound on the compacted summary, in characters
  # Optional per-lane overrides keyed by laneId. A lane with no entry inherits
  # `defaults`; an entry may set any subset of the four knobs. Examples:
  # lanes:
  #   foreground:               # the interactive answer lane (foregroundAnswerLaneId)
  #     rawCount: 16            # keep more verbatim turns for live conversation
  #     compactionThreshold: 60
  #   dream_consolidate:        # the slow consolidation dreaming lane
  #     rawCount: 10
  #     maxCompactedTokens: 2048

# ── Access: the channels prompts arrive on ───────────────────────────────────
access:
  # OpenAI HTTP/SSE edge — REQUIRED (the only mandatory channel).
  openai:
    port: 8080
    basePath: /v1

  # Ollama HTTP edge — OPTIONAL. Set a port to expose POST /api/chat and
  # POST /api/generate in Ollama's NDJSON / buffered-JSON dialect. It drives the
  # SAME admission core as the OpenAI edge, so the same bearer tokens (sent as
  # `Authorization: Bearer`) authenticate here.
  ollama:
    port: 8081
    basePath: /api

  # Anthropic Messages HTTP edge — OPTIONAL. Set a port to expose
  # POST /v1/messages in Anthropic's named-SSE / buffered-Message dialect. Same
  # shared bearer tokens, sent in the `x-api-key` header (or `Authorization:
  # Bearer` as a fallback).
  anthropic:
    port: 8082
    basePath: /v1

  # Telegram bot — OPTIONAL. Set botToken to enable long-polling intake.
  telegram:
    botToken: ${env:TELEGRAM_BOT_TOKEN}            # from @BotFather

  # Declarative identity source. A Telegram message is only admitted if its
  # sender's numeric id is whitelisted here; an OpenAI request is admitted if
  # its bearer matches.
  users:
    - id: owner
      displayName: Owner
      openaiBearerTokens:
        - ${env:TOM_BRAIN_OPENAI_TOKEN}            # any opaque string you'll send as Bearer
      telegramUserIds:
        - ${env:TELEGRAM_OWNER_USER_ID}            # your numeric Telegram user id

  rateLimit:
    capacity: 60
    refillTokens: 60
    refillPeriodSeconds: 60

  quota:
    dailyCap: 1000

# ── Extensions ───────────────────────────────────────────────────────────────
#
# The Extension-F tool / MCP / LLM-config bundle (`extensions:` block —
# `prompt_template/`, `llm_configuration/`, the three-layer model config) was
# retired with the scripted `call_llm_v1` loop (increment 9). The cognition now
# names prompts + routes through the `cognition/` config (`promptResolver` /
# `routeChainOf`) and runs its tools through the basic-tool registry, so there
# is no `extensions:` block to configure here.
