# Example whole-process run config for the tom_brain prototype.
#
# Consumed by two launchers, both reading this one file:
#   * tom_brain_run/bin/brain_serve.dart       — substrate + memory + access
#   * tom_brain_memory/bin/memory_mcp_server.dart — the `memory:` section only
#
# `${ENV}` references are expanded from the launching process's environment
# (memory.root, memory.sqliteVec.binariesRoot, access.telegram.botToken, and
# each user's openaiBearerTokens). Copy this file, fill in real values (or set
# the env vars), and pass the copy as the launcher's argument.

# ── Substrate: where tokens actually come from ───────────────────────────────
substrate:
  providers:
    - id: omlx
      kind: openai          # oMLX exposes an OpenAI-compatible endpoint
      baseUrl: ${TOM_BRAIN_OMLX_BASE_URI}      # e.g. http://10.8.0.7:8000/
      models:
        - ${TOM_BRAIN_OMLX_MODEL}              # e.g. gemma-4-26b-a4b-it-4bit
    - id: ollama
      kind: ollama
      baseUrl: ${TOM_BRAIN_OLLAMA_BASE_URI}    # e.g. http://127.0.0.1:11434/
      models:
        - ${TOM_BRAIN_OLLAMA_EMBED_MODEL}      # e.g. nomic-embed-text
  roleRoutes:
    assistant_to_user:
      - providerId: omlx
        model: ${TOM_BRAIN_OMLX_MODEL}
    # Extension-H retrieval roles — routed to the same substrate as the
    # assistant. The retrieval conductor's `recall_*` legs call these via
    # `sub.retrievalRole(...)`; an unrouted role makes that leg degrade to no
    # seeds (PE-6), so leaving these out silently weakens recall.
    recall_planner:
      - providerId: omlx
        model: ${TOM_BRAIN_OMLX_MODEL}
    hypothesis_writer:
      - providerId: omlx
        model: ${TOM_BRAIN_OMLX_MODEL}
    query_term_writer:
      - providerId: omlx
        model: ${TOM_BRAIN_OMLX_MODEL}
    category_selector:
      - providerId: omlx
        model: ${TOM_BRAIN_OMLX_MODEL}
    retrieval_reranker:
      - providerId: omlx
        model: ${TOM_BRAIN_OMLX_MODEL}
    profile_selector:
      - providerId: omlx
        model: ${TOM_BRAIN_OMLX_MODEL}
  embedding:
    providerId: ollama
    model: ${TOM_BRAIN_OLLAMA_EMBED_MODEL}
    dims: 768
    normalize: true

# ── Memory: the on-disk knowledge graph + the packaged vec0 binary ───────────
memory:
  root: ${TOM_BRAIN_MEMORY_ROOT}               # a writable directory; created if absent
  sqliteVec:
    binariesRoot: ${TOM_BINARIES_ROOT}/sqlite_vec   # holds <platform>/vec0.<ext>

# ── Access: the channels prompts arrive on ───────────────────────────────────
access:
  # OpenAI HTTP/SSE edge — REQUIRED (the only mandatory channel).
  openai:
    port: 8080
    basePath: /v1

  # Ollama HTTP edge — OPTIONAL. Set a port to expose POST /api/chat and
  # POST /api/generate in Ollama's NDJSON / buffered-JSON dialect. It drives the
  # SAME admission core as the OpenAI edge, so the same bearer tokens (sent as
  # `Authorization: Bearer`) authenticate here.
  ollama:
    port: 8081
    basePath: /api

  # Anthropic Messages HTTP edge — OPTIONAL. Set a port to expose
  # POST /v1/messages in Anthropic's named-SSE / buffered-Message dialect. Same
  # shared bearer tokens, sent in the `x-api-key` header (or `Authorization:
  # Bearer` as a fallback).
  anthropic:
    port: 8082
    basePath: /v1

  # Telegram bot — OPTIONAL. Set botToken to enable long-polling intake.
  telegram:
    botToken: ${TELEGRAM_BOT_TOKEN}            # from @BotFather

  # Declarative identity source. A Telegram message is only admitted if its
  # sender's numeric id is whitelisted here; an OpenAI request is admitted if
  # its bearer matches.
  users:
    - id: owner
      displayName: Owner
      openaiBearerTokens:
        - ${TOM_BRAIN_OPENAI_TOKEN}            # any opaque string you'll send as Bearer
      telegramUserIds:
        - ${TELEGRAM_OWNER_USER_ID}            # your numeric Telegram user id

  rateLimit:
    capacity: 60
    refillTokens: 60
    refillPeriodSeconds: 60

  quota:
    dailyCap: 1000

# ── Extensions: the Extension-F tool / MCP / LLM-config bundle ────────────────
#
# OPTIONAL. When present, boot assembles this block into the engine's
# `BrainEngineExtensions` bundle (Plan step 15; spec § 13, § 21.5, § 21.6): the
# tool registry, the MCP client, and the three-layer LLM configuration a future
# `call_llm_v1` reads. Omit the whole `extensions:` block for the prototype
# default — `answer_with_memory_v1` runs without it. (Run-launcher threading of
# this block is plan step 17; this example documents the shape boot consumes.)
extensions:
  # `prompt_template/` (§ 21.5) — one `<type>.yaml` per prompt type. Each names
  # the role, the assembled prompt layers, and the model binding the template
  # resolves against `llm_configuration/`.
  promptTemplateDir: ${TOM_BRAIN_PROMPT_TEMPLATE_DIR}   # e.g. ./config/prompt_template

  # `llm_configuration/` (§ 21.6) — the three layers:
  #   * `providers.yaml`   — layer 1: the substrate providers (REQUIRED; a
  #                          missing file is a hard ProvidersMissing at boot).
  #   * `models/<id>.yaml` — layer 2: per-model config, looked up lazily by id.
  #   * the binding itself — layer 3: lives in each prompt template.
  llmConfigurationDir: ${TOM_BRAIN_LLM_CONFIG_DIR}      # e.g. ./config/llm_configuration

  # Prompt types validated eagerly at boot: a missing template or an
  # unresolvable model surfaces a typed error BEFORE any run (hence before any
  # substrate call). Absent ⇒ nothing is pre-validated.
  requirePromptTypes:
    - assistant_to_user

  # `toolPolicy:` (§ 21.8) — the global tool-access default plus the shared
  # deny / enabled-groups / allow lists. `default` is one of
  # all | read_only | groups | explicit (absent ⇒ all).
  toolPolicy:
    default: all
    deny:
      - vscode.todo.*        # honoured under every allow-all prompt type

  # `mcpServers:` (§ 21.6) — a LIST of the MCP servers the `mcp.servers` /
  # `mcp.list` / `mcp.call` primitives reach out to. Each entry needs an `id` +
  # `transport` (stdio | http); stdio adds `command` / `args`, http adds `url` /
  # `headers`. The memory MCP server is the canonical entry; external servers
  # are added as further list items.
  mcpServers:
    - id: memory
      transport: stdio
      command: ${TOM_BRAIN_MEMORY_MCP_COMMAND}   # e.g. dart
      args:
        - run
        - tom_brain_memory:memory_mcp_server
