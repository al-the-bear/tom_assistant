name: tom_brain_run
description: The real (non-stub) higher assembly for the Tom Brain prototype — boots a whole cognition over the real on-disk isolate-hosted SqliteTomBrainMemory and the real substrate (router → OpenAiPassthroughProvider@oMLX for the LLM, OllamaEmbeddingService for embeddings), projects the RunCoordinator onto a QueueSnapshot, and stands the access process up on a port. The production sibling of tom_brain_smoke_prototype.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.10.8

# Why this project exists (Plan-2 step #30 / `prototype_implementation_plan_2.md`
# § "Build the real BrainProvisioner higher assembly").
#
# `tom_brain_access` is forbidden to import `tom_brain_substrate` /
# `tom_brain_memory` (its pubspec scope discipline + `dependency_surface_test`).
# It therefore receives an *already-booted* cognition through the
# `BrainProvisioner` seam, whose CLI default refuses — only "a higher assembly
# (Tom Assistant integration, or a test) that may legally import substrate +
# memory" can supply a real provisioner (`brain_provisioner.dart`).
#
# `tom_brain_smoke_prototype` is that higher assembly for the *smoke* (stub
# substrate + in-isolate memory double). `tom_brain_run` is its **production**
# sibling: the same wiring, but over the real substrate (real provider
# transports) and the real on-disk `SqliteTomBrainMemory`. Keeping the two apart
# is what lets the smoke doubles stay test-only while a real process boots the
# real cognition. It sits above all four brain packages and is the only
# production place that wires them together.
#
#   - tom_brain_access   — the running process: `startBrainAccessProcess`,
#                                     `ProvisionedBrain`, `QueueSnapshot`,
#                                     `AccessConfig`, the edge-security policies.
#   - tom_brain_procedure — `BrainProcessBoot` / `BrainProcessConfig`
#                                     (boots substrate → memory → engine →
#                                     dispatcher), `MemoryProvisioningConfig`,
#                                     `Dispatcher`, `RunCoordinator`.
#   - tom_brain_substrate          — `InProcessTomBrainSubstrate` + the real
#                                     provider / router / embedding building
#                                     blocks the substrate builder composes.
#   - tom_brain_memory             — the real `SqliteTomBrainMemory` (via the
#                                     `createSqliteTomBrainMemory` isolate
#                                     factory), `MemoryConfig`, the vec0 resolver.
#   - tom_brain_shared             — the cross-component vocabulary.
#   - tom_basics                   — workspace baseline; hosted to keep the
#                                     resolver consistent with the rest of the
#                                     closure.
dependencies:
  tom_brain_access:
    path: ../tom_brain_access
  tom_brain_procedure:
    path: ../tom_brain_procedure
  tom_brain_substrate:
    path: ../tom_brain_substrate
  tom_brain_memory:
    path: ../tom_brain_memory
  tom_brain_shared:
    path: ../tom_brain_shared
  # The Trail Observatory is the official configuration + control surface, so the
  # run assembly owns its lifecycle: `tom_brain serve` spawns the read-only backend in
  # a second isolate (`observatory_isolate_host.dart`) and tears it down on
  # shutdown, instead of leaving the operator to launch a separate process. This
  # is a deliberate mutual path dep — the observatory depends on `tom_brain_run`
  # for the cognition config model it mirrors (read-only), and the run layer
  # depends on the observatory to host it. `Isolate.spawn` over the shared
  # `startObservatoryServer` library function keeps it a genuine second isolate.
  tom_brain_observatory:
    path: ../tom_brain_observatory
  # The brain's configuration model and loaders (moved out of this package so
  # the observatory can read them without depending on the run). Re-exported
  # from lib/tom_brain_run.dart, so callers keep importing tom_brain_run.
  tom_brain_config:
    path: ../tom_brain_config
  # The retrieval eval harness (Plan-2 ext step #33; spec § 23.8) parses its
  # `retrieval_eval.yaml` through the canonical plain-map loader so no
  # `YamlMap`/`YamlList` node leaks into a `RetrievalEvalConfig`.
  tom_core_agentic:
    path: ../../tom_ai/core_extension/tom_core_agentic
  tom_basics: ">=1.0.0"
  # The unified `tom_brain` CLI binary (CLI plan step #8) is built on the
  # `tom_build_base` v2 tool framework (ToolRunner + ToolDefinition +
  # CommandExecutor), so `--help` / `--version` / subcommand dispatch / error
  # formatting are uniform with every other workspace CLI rather than hand-rolled.
  tom_build_base: ">=2.19.1"
  # The production entrypoint (`bin/tom_brain.dart serve`) and the #31 Verify suite
  # both manufacture the *real* substrate (OpenAI-passthrough + Ollama
  # providers), whose default wire HTTP client is sourced from the
  # `tom_core_kernel` factory via the active `TomPlatformUtils`. A bare
  # `dart run`/`dart test` process runs the fallback platform (its `httpClient()`
  # throws `UnimplementedError`); both install the standalone platform at startup
  # via `standalonePlatformUtils`. Mirrors `tom_brain_substrate`'s live-provider
  # smoke (p2_12). A regular dependency because it is imported from `bin/`.
  tom_core_server:
    path: ../../tom_ai/core/tom_core_server
  # The production MCP channel factory (`mcp_channel_factory.dart`) opens the
  # real wire transport to a configured external `stdio:` MCP server — request
  # f. It is the composition root the procedure package's transport-neutral
  # `DartMcpConnector` defers OS I/O to, so it needs the `dart_mcp` stdio
  # channel helper + `stream_channel` in `lib/` (not just the test harness).
  dart_mcp: ^0.5.0
  stream_channel: ^2.1.4
  # The bundle codegen (`bundle_codegen.dart`, CLI plan step 4) labels the
  # generated `brain_bundle.g.dart` with a `sha256:` content fingerprint over
  # the bundled prompt/script text and decoded native bytes — a real digest, so
  # the build hash is stable and verifiable, not a length-only signature.
  crypto: ^3.0.0
  # The run MCP channel factory (`mcp_channel_factory.dart`) opens an `http:`
  # MCP server by delegating to the substrate's `HttpMcpTransport`, whose
  # constructor takes an optional `package:http.Client` — so the factory's
  # injectable-client seam references `http.Client` in `lib/` (request b;
  # `agent_sdk_provider_and_mcp_liveness.md` § 2).
  http: ^1.2.0
  # `/switch_model` (request e) rewrites a single prompt's `llm:` binding in its
  # hand-authored, heavily-commented main-procedure config file. `yaml_edit`'s
  # surgical node update preserves every comment and formatting choice — only the
  # one node changes.
  yaml_edit: ^2.2.0
  # `/cli_server_port` parses the run-config to locate the `agent_sdk` providers
  # before `yaml_edit` rewrites each one's `options.bridgePort` — the read uses
  # `package:yaml`'s `loadYaml` + `YamlMap` / `YamlList` to walk the structure.
  yaml: ^3.1.0
  # The agent-SDK provider is `tom_core_agentic`'s `AgentSdkSessionProvider`
  # (`package:tom_core_agentic/agent_sdk.dart`), built here over the hosted
  # CLI-server transport. The run builder reads `PermissionMode` (validating the
  # config's `permissionMode`) and `defaultVSCodeBridgePort` from the scripting
  # API, which is why it is a direct dependency.
  tom_vscode_scripting_api: ^7.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  # The live Agent SDK suite (`live_agent_sdk_brain_test.dart`) reads a run's
  # events (`LlmRetry`, `LlmRunError`, `llmAnswerText`), which the substrate's
  # barrel does not re-export.
  tom_llm:
    path: ../../tom_ai/basics/tom_llm
  # The r38 HTTP MCP channel test drives the opened channel through a
  # `StreamQueue` (`package:async`) against a loopback `HttpServer` fixture.
  async: ^2.11.0
  # The #30 test boots the real on-disk memory with a *stub LLM*. `SmokeSubstrate`
  # is the canonical, compile-checked `TomBrainSubstrateClient` stub the smoke
  # already ships "as a library symbol (not a test fixture) so the harness and
  # every smoke step share one stub" — reused here as the stub LLM so the run
  # package does not hand-roll a second partial double. Test-only: production
  # boots `buildOmlxOllamaSubstrate`.
  tom_brain_smoke_prototype:
    path: ../tom_brain_smoke_prototype
  # The r52 LIVE Telegram end-to-end test drives the Telegram edge through an
  # in-process `LoopbackChatApi` (a consumer-authored `ChatApi` double, ported
  # from the access package's test support) injected via the
  # `telegramChatApiFactory` seam — no Bot API client, no socket. `tom_chattools`
  # ships the abstract `ChatApi` the double implements.
  tom_chattools: ^2.0.0
  # NOTE: `dart_mcp` + `stream_channel` are now main dependencies (above): the
  # production MCP channel factory needs them in `lib/`. The #32 LIVE end-to-end
  # test still drives a `TomBrainMemoryMcpServer` over an in-host
  # `StreamChannel<String>` pair with a real `dart_mcp` client — the same
  # harness shape the smoke's E.55 conformance test and the memory package's
  # MCP suites use — but reaches them through the main dependency.
