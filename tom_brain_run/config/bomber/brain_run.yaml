# Tom Brain — standard whole-process config for the `bomber` fleet host.
#
# This file is VERSION-CONTROLLED (config/<host>/brain_run.yaml). It carries no
# real secrets: the only sensitive values — the Telegram bot token and the
# owner's Telegram user id — are `${env:NAME}` tokens resolved at boot from the shell
# environment (exported in ~/.bashrc on bomber):
#
#   TELEGRAM_TOM_BRAIN_TOKEN — the @BotFather token for the tom_brain bot
#   TELEGRAM_TOM_BRAIN_USER  — the owner's numeric Telegram user id (whitelist)
#
# Launch with `run_tom_brain.sh` (which defaults to this host's config) or:
#   dart run bin/brain_serve.dart config/bomber/brain_run.yaml
#
# Substrate: Gemma on oMLX (OpenAI-compatible) over the VPN for the LLM, local
# Ollama for embeddings. Access: all three API gateways (OpenAI / Ollama /
# Anthropic) plus the Telegram channel. Trailing: full mode into the shared
# `_ai` mount, keyed by host.
substrate:
  providers:
    - id: omlx
      kind: openai
      baseUrl: http://10.8.0.7:8000/
      models:
        - gemma-4-26b-a4b-it-4bit
    - id: ollama
      kind: ollama
      baseUrl: http://127.0.0.1:11434/
      models:
        - nomic-embed-text
    # ── Anthropic Agent-SDK providers (request a) ──────────────────────────
    # Claude Code driven through the VS Code Scripting API bridge — a
    # home-grown tom remote-rpc protocol on the CLI server port (NOT HTTP, so
    # there is no `/v1/models` to query; the four model ids below are
    # owner-confirmed). Claude Code owns its own tool / MCP / memory loop; from
    # tom_brain's side each profile is a single black-box completion on the
    # `LlmProvider` seam (spec § 1.1). 4 families × 3 session modes = 12
    # profiles (spec § 1.7), each a distinct routing target. Every cognition
    # role below is wired to `claude:haiku:none` (the whole engine runs on
    # Claude Haiku); the user-facing answer route (`assistant_claude_brain`)
    # uses `claude:haiku:brain` for session continuity. An operator repoints a
    # role via a `roleRoutes` edit or the `/switch_model` command (request e).
    # Common options: the bridge on
    # 127.0.0.1:19900, `acceptEdits` permission, a 24-turn internal loop cap,
    # and the `vscode_ext` MCP server (below) offered into Claude Code's own
    # loop.
    #   * none  — never passes a session id; every call is a first call.
    #   * brain — persists the Claude session keyed by the tom_brain session id
    #             under the run store (`agent_sdk_sessions.json` at memory.root,
    #             threaded by the engine); evicts + retries once on a
    #             session-not-found error. No extra options.
    #   * quest — reuses the session of the quest the VS Code window runs in,
    #             read-only from `{questHistoryRoot}/{questId}/history/
    #             {sessionKey}.session.json` (the file the extension writes). We
    #             bind the tom_brain quest's `default` session.
    # ── haiku ──
    - id: claude:haiku:none
      kind: agent_sdk
      models:
        - claude-haiku-4-5-20251001
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: none
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:haiku:brain
      kind: agent_sdk
      models:
        - claude-haiku-4-5-20251001
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: brain
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:haiku:quest
      kind: agent_sdk
      models:
        - claude-haiku-4-5-20251001
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: quest
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
        questId: tom_brain
        sessionKey: default
        questHistoryRoot: /srv/repos/al_the_bear/_ai/quests
    # ── sonnet ──
    - id: claude:sonnet:none
      kind: agent_sdk
      models:
        - claude-sonnet-4-6
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: none
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:sonnet:brain
      kind: agent_sdk
      models:
        - claude-sonnet-4-6
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: brain
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:sonnet:quest
      kind: agent_sdk
      models:
        - claude-sonnet-4-6
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: quest
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
        questId: tom_brain
        sessionKey: default
        questHistoryRoot: /srv/repos/al_the_bear/_ai/quests
    # ── opus ──
    - id: claude:opus:none
      kind: agent_sdk
      models:
        - claude-opus-4-8
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: none
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:opus:brain
      kind: agent_sdk
      models:
        - claude-opus-4-8
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: brain
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:opus:quest
      kind: agent_sdk
      models:
        - claude-opus-4-8
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: quest
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
        questId: tom_brain
        sessionKey: default
        questHistoryRoot: /srv/repos/al_the_bear/_ai/quests
    # ── fable ──
    - id: claude:fable:none
      kind: agent_sdk
      models:
        - claude-fable-5
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: none
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:fable:brain
      kind: agent_sdk
      models:
        - claude-fable-5
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: brain
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
    - id: claude:fable:quest
      kind: agent_sdk
      models:
        - claude-fable-5
      options:
        bridgeHost: 127.0.0.1
        bridgePort: 19900
        sessionMode: quest
        permissionMode: acceptEdits
        maxTurns: 24
        mcpServers: [vscode_ext]
        questId: tom_brain
        sessionKey: default
        questHistoryRoot: /srv/repos/al_the_bear/_ai/quests
  roleRoutes:
    # The user-facing answer role stays on Claude; every other role below is
    # repointed to the local mbp Gemma (omlx) — the free substrate for memory
    # evaluation / retrieval / reasoning sub-judgements.
    assistant_to_user:
      - providerId: claude:haiku:none
        model: claude-haiku-4-5-20251001
    # Extension-H retrieval roles. The four-strategy retrieval conductor's
    # `recall_*` legs call these via `sub.retrievalRole(...)`; without a route
    # each leg is unroutable and the conductor degrades to the two non-LLM
    # seeds (PE-6), so recall runs far weaker than designed. All route to
    # Claude Haiku in session mode `none` (fresh per call — these are stateless
    # sub-judgements that must NOT share the answer's `:brain` session).
    recall_planner:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    hypothesis_writer:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    query_term_writer:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    category_selector:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    retrieval_reranker:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    profile_selector:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    # Core thinking-loop roles. `prompt_analyzer_v1` dispatches `analyser`;
    # `answer_with_thinking_v1` dispatches `analyser` (analyse), `sub_thinker`
    # (sub-prompt), `assistant_to_user` (synthesise, above), and `evaluator`
    # (self-critique). Without these routes the thinking loop throws
    # `RoleNotFound` on the first analyse — so they are mandatory for step 9.
    # `recaller` and `researcher` complete the six-role core roster.
    analyser:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    sub_thinker:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    recaller:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    evaluator:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    researcher:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    # Procedure-authoring roles (`author_new_procedure_v1`): draft / critique /
    # select an authored procedure.
    procedure_author:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    procedure_critic:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    procedure_selector:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    # Creation-loop roles (`create_v1`): draft / test / review an artifact.
    creator:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    tester:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    reviewer:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    # Planning-loop roles (`plan_v1`): frame / decompose / order / critique /
    # re-plan.
    planner:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    decomposer:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    estimator:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    plan_evaluator:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    re_planner:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    # Dreaming-agent roles (`dream_*_v1`, gated by the `dream:` block below —
    # off by default). Each dreaming pass makes one LLM judgement under its
    # role; an unrouted role would throw `RoleNotFound` the moment dreaming is
    # enabled.
    extractor:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    connector:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    synthesiser:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    inquisitor:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    pruner:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    reconsolidator:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
    repetition_detector:
      - providerId: omlx
        model: gemma-4-26b-a4b-it-4bit
  embedding:
    providerId: ollama
    model: nomic-embed-text
    dims: 768
    normalize: true
memory:
  # Runtime data store (the .db files + checkpoints) — machine-local, DURABLE.
  # Lives under the shared `_ai` mount keyed by fleet host (bomber), so it
  # survives a process restart (the "nothing is ever lost" contract). The
  # runtime .db files themselves are git-ignored (`_ai/tom_brain/.gitignore`);
  # backup is the tiered-backup pipeline's job, not git's.
  root: /srv/repos/al_the_bear/_ai/tom_brain/bomber/memory
  sqliteVec:
    binariesRoot: /srv/repos/al_the_bear/inhouse/second_wind/enterprise_flutter/tom_agent_container/tom_binaries/sqlite_vec
# Per-lane conversation/activity-history sizing (hub spec § 22.6b/c). This is a
# TOP-LEVEL block (sibling of `access:`), distinct from the nested
# `access.history.directory` above which only sets the durable history path.
# The four knobs are resolved per lane as `lane override -> defaults -> code
# default (HistorySizing.standard())`; `rawCount` has a hard floor of 10 (a
# value below 10 is rejected, not clamped). `defaults` applies to every lane —
# the foreground answer lane and each dreaming lane — that carries no override.
# Validates against .tom/json-schema/tom_brain/history.schema.json.
history:
  defaults:
    rawCount: 10
    compactionThreshold: 40
    maxCompactedTokens: 1024
    maxCompactedChars: 6000
  # Optional per-lane overrides keyed by laneId. A lane with no entry inherits
  # `defaults`; an entry may set any subset of the four knobs. Examples:
  # lanes:
  #   foreground:            # the interactive answer lane (foregroundAnswerLaneId)
  #     rawCount: 16         # keep more verbatim turns for live conversation
  #     compactionThreshold: 60
  #   dream_consolidate:     # the slow consolidation dreaming lane
  #     rawCount: 10
  #     maxCompactedTokens: 2048
access:
  openai:
    port: 8080
    basePath: /v1
  ollama:
    port: 8081
    basePath: /api
  anthropic:
    port: 8082
    basePath: /v1
  telegram:
    botToken: ${env:TELEGRAM_TOM_BRAIN_TOKEN}
  users:
    - id: owner
      displayName: Owner
      openaiBearerTokens:
        # Local-only dev bearer for the 127.0.0.1 OpenAI edge — not a real
        # secret. Override per deployment if the edge is ever exposed.
        - run-token
      telegramUserIds:
        - ${env:TELEGRAM_TOM_BRAIN_USER}
  # Rate limit / quota set very high (effectively unlimited): the owner is the
  # sole principal and the brain should never throttle or quota-block its own
  # multi-step agentic work.
  rateLimit:
    capacity: 1000000000
    refillTokens: 1000000000
    refillPeriodSeconds: 1
  quota:
    dailyCap: 1000000000
  # Conversation-history persistence (access spec § 21.10; umbrella Hard
  # principle 6 — "nothing is ever lost"). The session manager writes the whole
  # session-histories snapshot (the global per-(user, channel) histories plus
  # every per-session entry) to `histories.json` under this directory after
  # each answered turn, and rehydrates from it on boot — so a process restart
  # resumes every conversation mid-stream (the brain keeps remembering your name
  # across a restart). Lives under the shared `_ai` mount keyed by fleet host
  # (bomber), DURABLE on disk but git-ignored (`_ai/tom_brain/.gitignore`);
  # backup is the tiered-backup pipeline's job, not git's. `null` (omit the
  # block) keeps histories in process only.
  history:
    directory: /srv/repos/al_the_bear/_ai/tom_brain/bomber/history
# Outbound MCP servers (access/procedure spec § 21.3 / § 21.6; request c). Each
# entry is a server the brain may call *out* to. `exposeToLlms` is the static
# half of `offered = exposeToLlms && isLive`: when true, the server's tools are
# merged into the procedure tool loop (and offered to the LLM) as long as the
# 30 s liveness monitor finds the server reachable; a dead server drops out of
# the loop live and rejoins when it recovers, with no restart. Closed by default
# (omit `exposeToLlms` ⇒ false ⇒ callable via the `mcp.*` primitives but never
# auto-merged into the tool loop).
mcpServers:
  # The Tom VS Code Extension MCP server (request b) — the read-only HTTP
  # surface the extension serves on the loopback. Exposed to the tool loop so
  # the brain can query the live editor/workspace state while it is up.
  - id: vscode_ext
    transport: http
    url: http://127.0.0.1:19920/
    description: Tom VS Code Extension (read-only workspace/editor tools)
    exposeToLlms: true
# Full trailing mode (tom_brain_logging.md §4.1): the whole trail tree is
# written under the shared `_ai` mount, keyed by fleet host id (bomber). The
# raw tiers (llm/, incoming/, procedures/, memory/, brain.log, components/) are
# git-ignored by the TrailJanitor; the summary tier (sessions/, summary/) is
# versioned. Caps left at their §8 defaults.
trail:
  root: /srv/repos/al_the_bear/_ai/tom_brain_trail/bomber
# Two-tier file-scope roots for the engine's `file.*` tools (spec § 21.4).
#   * writeScope — directories the write tools (file.write / file.edit /
#     file.delete / test.*) may target; the first is the primary write target.
#   * readScope  — directories the read tools (file.read / file.diff /
#     grep.search / file.search / file.list / analyze.*) may additionally reach
#     but never modify. A writeable root is implicitly readable.
# Add directories under either tier as the brain needs reach into more of the
# tree. Omitting the block leaves the engine on its neutral placeholder root
# (no real file reach).
tools:
  # The brain owns its own run-project folder for scratch writes.
  writeScope:
    - /srv/repos/al_the_bear/inhouse/second_wind/enterprise_flutter/tom_agent_container/tom_assistant/tom_brain_run
  # The whole tom_agent_container workspace is granted READ-ONLY: the brain may
  # inspect it for context but must never write or delete inside it.
  readScope:
    - /srv/repos/al_the_bear/inhouse/second_wind/enterprise_flutter/tom_agent_container
# The cognition config tree (`prompt_configuration.md` §7.4): the directory
# holding `registry.yaml`, the per-procedure config/template folders, and the
# `llm/` route folder. The run assembly turns this tree into the two `sub.run`
# seams every procedure consults — the named-prompt resolver (the migrated
# `answer_with_memory_v1` runs `assist_user.answer_with_memory.assembly` from
# here) and the named-route resolver. Version-controlled alongside this config.
cognition:
  root: /srv/repos/al_the_bear/inhouse/second_wind/enterprise_flutter/tom_agent_container/tom_assistant/tom_brain_run/config/bomber/cognition
