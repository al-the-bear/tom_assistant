# The `assist_user` main procedure (`prompt_configuration.md` §5 / §5.4).
#
# Main-level settings are inherited by every sub-procedure and prompt beneath
# unless overridden: the full tool catalogue, the user-facing
# `assistant_to_user` role (persona + assistant-dedication anchor), and the
# `assistant` LLM route.
#
# The `answer_with_memory` sub-procedure carries the single `assembly` prompt
# the migrated `answer_with_memory_v1` runs — its template assembles the recall
# context, prior turns, todo discipline, and the live prompt around the
# `${tools.catalogue}` marker the engine renders from the resolved tool set.
#
# The `answer_with_thinking` sub-procedure (`prompt_configuration.md` §9 / §5.3)
# carries the six prompts the recursive `answer_with_thinking_v1` loop runs: the
# first-pass `analysis` / `synthesis` and their re-entry variants that fold in the
# accumulated rejection history, the `sub_think` reasoning pass, and the
# `critique` gate. Each prompt's `role` / `tools` override the inherited
# user-facing defaults per §5.3: the reasoning stages run read-only under their
# own personas, `synthesis` is the tool-enabled "normal prompt" the loop wraps
# (inherits `assistant_to_user` + `tools: all`), and `critique` is a no-tool
# `evaluator` verdict.

# Inherited default: every sub-procedure/prompt beneath runs on the local mbp
# `assistant` route (omlx/Gemma) — free, low-latency, used for all the memory
# evaluation / analysis / planning / authoring sub-judgements. ONLY the
# user-facing *answer* prompts (`answer_with_memory.assembly` and
# `answer_with_thinking.synthesis`/`synthesis_reentry`) pin themselves back to
# `assistant_claude_brain` (Claude, session-threaded). Flip a sub-judgement to
# Claude by adding an `llm: assistant_claude_brain` override on its prompt.
tools: all
llm: assistant
role: assistant_to_user

# The `prompt_analyzer` sub-procedure (`prompt_configuration.md` §10) carries the
# single `classification` prompt the migrated `prompt_analyzer_v1` entry router
# runs: it routes a user prompt (`${text}`) to the normal or thinking branch. It
# runs read-only (no tools) under the `analyser` persona and asks for one verdict
# token.
prompt_analyzer:
  prompts:
    classification:
      template: prompt_analyzer.classification
      tools: none
      role: analyser

# The `answer_with_memory` sub-procedure also carries the three migrated ad-hoc
# templates (`prompt_configuration.md` §13.2 / plan step 10): the
# `completion_check` confirmation prompt the loop's DONE/CONTINUE turn runs (a
# no-tool prompt under the inherited `assistant_to_user` role — its system half is
# role-supplied per §9, so only the `.user.md` half exists), and the two fragments
# `continuation_hint` (the static "resume unfinished work" reminder) and
# `todo_list` (the `${todo_entries}` checklist the resolver renders from the live
# `todo.list` result).
answer_with_memory:
  prompts:
    assembly:
      template: answer_with_memory.assembly
      # The user-facing answer — pinned to Claude (overrides the gemma default).
      llm: assistant_claude_brain
    completion_check:
      template: answer_with_memory.completion_check
      tools: none
      channel: thinking
    continuation_hint:
      template: answer_with_memory.continuation_hint
      kind: fragment
    todo_list:
      template: answer_with_memory.todo_list
      kind: fragment

# The `recall_conductor` sub-procedure (memory § 6.7) carries the single
# `curate` prompt the `recall_conductor_v1` pre-answer curation loop runs: it
# judges whether the surfaced memory is enough, requests targeted re-searches
# when it is not, and curates a small high-signal set for the answer stage. It
# runs read-only (no tools) under the existing `recaller` persona (whose remit —
# "re-rank the recalled items, drop low-signal items, compose the recall context
# the answer stage quotes from" — is exactly this curation act, so no new role is
# minted) and — deliberately — stays on the inherited cheap local `assistant`
# (Gemma) route: the curation judgement is exactly the kind of low-stakes
# sub-judgement the free route handles, leaving Claude for the user-facing answer.
recall_conductor:
  prompts:
    curate:
      template: recall_conductor.curate
      tools: none
      role: recaller

# The `research` sub-procedure (`prompt_configuration.md` §10) carries the single
# `claim_extraction` prompt the migrated `research_v1` runs: it distils the
# fetched page text (`${body}`) into one atomic factual Claim. It runs read-only
# (no tools) under the dedicated `researcher` persona.
research:
  prompts:
    claim_extraction:
      template: research.claim_extraction
      tools: none
      role: researcher

# The `plan` sub-procedure (`prompt_configuration.md` §10) carries the five
# prompts the migrated `plan_v1` planning loop runs: `classify` frames the goal
# (`planner`), `decompose` breaks it into steps (`decomposer`), `order` sequences
# them (`estimator`), `evaluate` critiques the graph (`plan_evaluator`), and
# `replan` proposes surgical replacements against a live plan (`re_planner`).
# Each runs read-only under its own planning persona.
plan:
  prompts:
    classify:
      template: plan.classify
      tools: none
      role: planner
    decompose:
      template: plan.decompose
      tools: none
      role: decomposer
    order:
      template: plan.order
      tools: none
      role: estimator
    evaluate:
      template: plan.evaluate
      tools: none
      role: plan_evaluator
    replan:
      template: plan.replan
      tools: none
      role: re_planner

# The `create` sub-procedure (`prompt_configuration.md` §10) carries the three
# prompts the migrated `create_v1` creation loop runs: `test_first` drafts the
# success-check before the artifact exists (`tester`), `draft` composes the
# artifact (`creator`), and `review` critiques it against the success criterion
# and the automated check (`reviewer`). The dynamic re-entry preamble, the
# test-first note, the recalled-memory block, and the check result are assembled
# in-script and folded into the templates' `${revision}` / `${extras}` /
# `${check}` slots (the `revision_context` fragment, §10). Each runs read-only.
create:
  prompts:
    test_first:
      template: create.test_first
      tools: none
      role: tester
    draft:
      template: create.draft
      tools: none
      role: creator
    review:
      template: create.review
      tools: none
      role: reviewer

# The `author` sub-procedure (`prompt_configuration.md` §10) carries the three
# prompts the migrated `author_new_procedure_v1` authoring loop runs: `draft`
# composes the candidate d4rt source (`procedure_author`), `fix_validation`
# re-drafts against the deterministic validator findings (`procedure_author`),
# and `critique` judges the valid draft against the intent (`procedure_critic`).
# Each runs read-only.
author:
  prompts:
    draft:
      template: author.draft
      tools: none
      role: procedure_author
    fix_validation:
      template: author.fix_validation
      tools: none
      role: procedure_author
    critique:
      template: author.critique
      tools: none
      role: procedure_critic

answer_with_thinking:
  prompts:
    analysis:
      template: answer_with_thinking.analysis
      tools: readonly
      role: analyser
    analysis_reentry:
      template: answer_with_thinking.analysis_reentry
      tools: readonly
      role: analyser
    sub_think:
      template: answer_with_thinking.sub_think
      tools: readonly
      role: sub_thinker
    synthesis:
      template: answer_with_thinking.synthesis
      tools: all
      # The user-facing answer (thinking branch) — pinned to Claude.
      llm: assistant_claude_brain
    synthesis_reentry:
      template: answer_with_thinking.synthesis_reentry
      tools: all
      # The user-facing answer on re-entry — pinned to Claude.
      llm: assistant_claude_brain
    critique:
      template: answer_with_thinking.critique
      tools: none
      role: evaluator
    # The recursive thinking loop shares the completion-check / continuation-hint /
    # todo-list machinery with `answer_with_memory` — the procedures shared the
    # Dart string builders (plan step 10), so the registrations point `template:`
    # at the same `answer_with_memory.*` stems (both sub-procedures resolve under
    # the `assist_user/` folder).
    completion_check:
      template: answer_with_memory.completion_check
      tools: none
      channel: thinking
    continuation_hint:
      template: answer_with_memory.continuation_hint
      kind: fragment
    todo_list:
      template: answer_with_memory.todo_list
      kind: fragment
