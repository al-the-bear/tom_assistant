# The `assist_user` main procedure (`prompt_configuration.md` §5 / §5.4).
#
# Main-level settings are inherited by every sub-procedure and prompt beneath
# unless overridden: the full tool catalogue, the user-facing
# `assistant_to_user` role (persona + assistant-dedication anchor), and the
# `assistant` LLM route.
#
# The `answer_with_memory` sub-procedure carries the single `assembly` prompt
# the migrated `answer_with_memory_v1` runs — its template assembles the recall
# context, prior turns, todo discipline, and the live prompt around the
# `${tools.catalogue}` marker the engine renders from the resolved tool set.
#
# The `answer_with_thinking` sub-procedure (`prompt_configuration.md` §9 / §5.3)
# carries the six prompts the recursive `answer_with_thinking_v1` loop runs: the
# first-pass `analysis` / `synthesis` and their re-entry variants that fold in the
# accumulated rejection history, the `sub_think` reasoning pass, and the
# `critique` gate. Each prompt's `role` / `tools` override the inherited
# user-facing defaults per §5.3: the reasoning stages run read-only under their
# own personas, `synthesis` is the tool-enabled "normal prompt" the loop wraps
# (inherits `assistant_to_user` + `tools: all`), and `critique` is a no-tool
# `evaluator` verdict.

tools: all
llm: assistant
role: assistant_to_user

answer_with_memory:
  prompts:
    assembly:
      template: answer_with_memory.assembly.md

# The `research` sub-procedure (`prompt_configuration.md` §10) carries the single
# `claim_extraction` prompt the migrated `research_v1` runs: it distils the
# fetched page text (`${body}`) into one atomic factual Claim. It runs read-only
# (no tools) under the dedicated `researcher` persona.
research:
  prompts:
    claim_extraction:
      template: research.claim_extraction.md
      tools: none
      role: researcher

answer_with_thinking:
  prompts:
    analysis:
      template: answer_with_thinking.analysis.md
      tools: readonly
      role: analyser
    analysis_reentry:
      template: answer_with_thinking.analysis_reentry.md
      tools: readonly
      role: analyser
    sub_think:
      template: answer_with_thinking.sub_think.md
      tools: readonly
      role: sub_thinker
    synthesis:
      template: answer_with_thinking.synthesis.md
      tools: all
    synthesis_reentry:
      template: answer_with_thinking.synthesis_reentry.md
      tools: all
    critique:
      template: answer_with_thinking.critique.md
      tools: none
      role: evaluator
