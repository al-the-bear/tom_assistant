name: tom_brain_observatory
description: Read-only observability web app for the Tom Brain prototype — a Dart-shelf Trail Read API backend that also serves an embedded Flutter-web front-end (one process, one origin, loopback only). Module 1 (Prompt Tracing) reads the trail tree under _ai/tom_brain_trail/<host>/; Module 2 (Memory Monitoring) reads the memory MCP read API. Never writes the trail, the memory store, or any brain control surface (prompt_tracing.md OBS-1..OBS-5).
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.10.8

# Why this project exists (`prompt_tracing.md` § 2.2, build-order step 2;
# `prompt_tracing_plan.md` PT-0.2). The observatory is the "one-way mirror" over a
# running brain: a Dart-shelf server that serves a read-only JSON+SSE API under
# `/api` and the embedded Flutter-web build under `/`. Per the workspace base-first
# rule it is built on the two shared infrastructure libraries rather than
# re-implementing server/CLI plumbing:
#
#   - tom_core_server — shelf + router + the endpoint pipeline + the static-file
#                       handler that serves the embedded web build (§ 8.3, § 8.5).
#   - tom_build_base  — the CLI baseline (config load, `--version` / `--help`)
#                       every workspace tool shares.
#
# In-tree path deps mirror the rest of the prototype tree (`tom_brain_run`'s
# pubspec): the brain packages co-develop against the live tom_ai libraries.
# The Flutter-web sub-app and the read-API code land in later phases (PT-1.*,
# PT-2.0); this scaffold is the analyze-clean skeleton they attach to.
dependencies:
  tom_core_server:
    path: ../../tom_ai/core/tom_core_server
  # Hosted, not path — matching the rest of the brain tree (`tom_brain_run`'s
  # closure resolves `tom_build_base` from pub.dev as a hosted transitive). A
  # direct path dep here would collide with that hosted source (a non-root path
  # dep cannot coexist with a hosted dep of the same name without an override,
  # which the workspace rule forbids). `^2.6.21` is the version the whole brain
  # closure already locks.
  tom_build_base: ">=2.6.25"
  # The source-authoring surface (§ 6.3, AUTH-3) validates a procedure script
  # *before* it lands. The gate must be the brain's own gate, never a divergent
  # copy: a reimplemented validator could accept a script the brain rejects (or
  # reject a valid edit), exactly the failure AUTH-3 exists to prevent. So the
  # observatory calls `ProcedureValidationChain` (header → sandbox → contract,
  # LLM-free, executes nothing) from the same package the engine loads scripts
  # with. In-tree path dep like the rest of the brain tree.
  tom_brain_procedure:
    path: ../tom_brain_procedure
  # The editable-catalogue route (`GET /api/catalogue`, plan step 14) serves the
  # `CognitionConfig.catalogue()` index (plan step 13) — every registered
  # template, the role prose files, and the config-file inventory. That model
  # lives in `tom_brain_config` (the configuration the run boots from), so the
  # observatory reads it from there rather than re-deriving the registry shape
  # (which would drift from what the brain actually loads). Not `tom_brain_run`:
  # the run hosts the observatory, and depending on it closed a cycle. In-tree
  # path dep like the rest of the brain tree; read-only — the observatory only
  # *reads* the parsed config.
  tom_brain_config:
    path: ../tom_brain_config
  # The config-authoring surface (`GET`/`PUT /api/config`, plan step 16, § 6.3
  # AUTH-3) validates a `substrate:` block *before* it lands, and the gate must be
  # the brain's own parser — never a divergent copy that could accept a config the
  # brain rejects at boot (or reject a valid one). So a substrate edit is parsed by
  # `SubstrateConfigLoader.parse` (pure, no I/O), the same loader the run assembly
  # uses. Registry/procedure/llm edits go through `CognitionConfigLoader` (already
  # available via `tom_brain_config`). In-tree path dep like the rest of the tree.
  tom_brain_substrate:
    path: ../tom_brain_substrate
  # The Trail Read API (PT-1.4 / PT-1.5) is a thin read-only shelf service.
  # tom_core_server uses shelf internally but does not re-export it, so the
  # router + static-file handler are taken directly (the same shelf the base
  # server is built on). `path` resolves the `../../llm/...` links the
  # procedures `.log` files carry, server-side, against the trail root.
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  shelf_static: ^1.1.3
  path: ^1.9.0
  # The Module-2 memory connector (`http_mcp_read_connection.dart`, § 8.4) wraps
  # the substrate's `HttpMcpTransport`, which takes an injectable `http.Client`
  # (a `MockClient` in tests). `^1.2.0` is the version the whole brain closure
  # already locks (substrate / run).
  http: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
