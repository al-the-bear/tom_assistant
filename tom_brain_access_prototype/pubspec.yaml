name: tom_brain_access_prototype
description: Prototype access layer for Tom Brain — the inbound surface (OpenAI HTTP/SSE + Telegram), Access-object production, identity / session / persona resolution, edge security, the cheap kind-hint classifier, and outbound delivery. This phase ships the actual running process.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.10.8

# Dependency discipline (Plan step E.7 / `tom_brain_access_prototype_specification.md`).
#
# The access prototype is the *inbound edge* of Tom Brain and the actual
# running process. It owns the channels that carry real user work in
# (OpenAI HTTP/SSE + Telegram), produces the `Access` object the
# dispatcher consumes, resolves identity / session / persona, enforces
# edge security, runs the cheap kind-hint classifier, and delivers
# outbound chunks back. E.7 lands exactly the six runtime dependencies the
# plan names — no more.
#
#   - tom_brain_shared    — cross-component vocabulary. The access layer
#                           *produces* the `Access` object (plus
#                           `InboundRequest`, `OutboundChunk`,
#                           `DeliverCallback`, `ResolvedIdentity`,
#                           `Session`, `Persona`, `InboundKinds`) the
#                           dispatcher consumes, and it wraps no prompt
#                           itself (substrate owns the anchor), so this is
#                           the one Tom-Brain vocabulary library it imports
#                           directly. Path dep — `publish_to: none`.
#   - tom_brain_procedure_prototype
#                         — INTERFACE BOUNDARY ONLY. The access layer hands
#                           every inbound request to the dispatcher's
#                           single entry point `Dispatcher.accept(Access)`
#                           (D.14). It consumes the dispatcher's public
#                           surface only — never reaches into its
#                           `lib/src/` and never imports the engine, memory
#                           bridge, or substrate bridge directly. Path
#                           dep — `publish_to: none`.
#   - tom_basics          — workspace baseline (`TomLogger`/`tomLog`, UUID,
#                           exception types). Hosted to keep the resolver
#                           consistent with `tom_core_kernel` (which
#                           depends on `tom_basics: any` from pub.dev) —
#                           the same convention memory (A.22), substrate
#                           (B.7), and the procedure prototype (C.7)
#                           adopted.
#   - tom_core_kernel     — `TomBean` (bean-locator surface; the plan calls
#                           it `BeanLocator`), `TomLogger` categories,
#                           `HttpClient` for the E.53/E.58 real-HTTP
#                           conformance client, and — the access layer's
#                           load-bearing import — `TomBearerAuthentication`
#                           (E.28). The plan's E.7 parenthetical attributes
#                           `TomBearerAuthentication` to `tom_core_server`,
#                           but the class actually lives here (same finding
#                           as substrate's Q-B.7.3; logged Q-E.7.2). Path
#                           dep.
#   - tom_core_server     — the inbound HTTP surface: shelf + a router
#                           (confirmed at E.3) and the endpoint pipeline
#                           (`TomEndpoint` / `TomEndpointBase` /
#                           `TomEndpointHandler` — the plan's `Endpoint` /
#                           `EndpointPipeline`; the real symbols are
#                           `Tom`-prefixed, logged Q-E.7.2). The OpenAI
#                           adapter (E.11) mounts `/v1/` against this
#                           surface; `TomBearerAuthentication` is re-exported
#                           through this barrel from `tom_core_kernel`. Path
#                           dep.
#   - tom_chattools       — the Telegram adapter (E.19–E.23): `ChatApi`
#                           (the abstract surface; the plan's `ChatAPI`
#                           casing is corrected to `ChatApi` per Q-E.4.1)
#                           and `TelegramChatConfig` (long-polling). The
#                           E.4 pin `^1.0.2` is adopted verbatim — the
#                           single source of truth recorded at E.4.
#   - tom_build_base      — ADDED AT E.9. The workspace rule mandates that
#                           every CLI tool is built on `tom_build_base`'s
#                           `ToolDefinition` / `ToolRunner` (shared arg
#                           parsing, `--version` / `--help`, exit codes).
#                           The access prototype is the *running process*,
#                           so its `bin/` entry point consumes the v2 tool
#                           framework (`tom_build_base_v2.dart`). Hosted
#                           `^2.6.21` — the version already resolved in the
#                           workspace closure (procedure prototype lock);
#                           `tom_build_base` is published to pub.dev, so no
#                           path override is needed (and none is permitted).
#
# Explicitly NOT here (scope discipline):
#
#   (shelf / shelf_router were held out at E.7 and ADDED AT E.11 once the
#    mounting strategy was decided — see the direct-deps block above.)
#   - tom_brain_memory / tom_brain_substrate
#                         — NOT direct deps. The access layer never talks
#                           to memory or substrate directly; everything
#                           flows through the dispatcher
#                           (`tom_brain_procedure_prototype`). Adding either
#                           would let the edge bypass the dispatcher's
#                           foreground/background coordinator and the run
#                           recorder — a layering violation.
#   - http / dio          — `tom_core_kernel.HttpClient` is the only
#                           outbound HTTP path (the E.53/E.58 conformance
#                           client). A second HTTP client would defeat the
#                           shared retry / circuit-breaker policy.
#   - dart_mcp            — the access layer is not an MCP peer. Memory
#                           owns the MCP server (A.75); substrate owns the
#                           MCP client (B.33). The edge speaks OpenAI +
#                           Telegram only.
#   - logger / logging    — `tomLog` from tom_basics is the only log
#                           surface permitted at this layer.
#
# The dependency-discipline test (`test/dependency_surface_test.dart`)
# enforces this contract at build time. Adding anything else here without
# updating that test will fail CI.
#
# Forward steps:
#   - E.8  — `lib/src/` folder layout (`adapters/openai_http_sse/`,
#            `adapters/telegram/`, `identity/`, `edge_security/`,
#            `heuristic_classifier/`, `delivery/`, `boot/`, `config/`,
#            `api/`). Removes the `lib/src/.gitkeep` placeholder.
#   - E.9  — `bin/tom_brain_access_prototype.dart` via `tom_build_base`'s
#            `ToolDefinition` (the first base-first touch point in Phase E)
#            and the `pubspec.lock` decision (Q-E.6.2).
#   - E.10 — `.tom_metadata/tom_master.yaml` wiring — no-op per policy
#            override 5.
dependencies:
  tom_brain_shared:
    path: ../tom_brain_shared
  tom_brain_procedure_prototype:
    path: ../tom_brain_procedure_prototype
  tom_basics: ^1.0.0
  tom_core_kernel:
    path: ../../tom_ai/core/tom_core_kernel
  tom_core_server:
    path: ../../tom_ai/core/tom_core_server
  tom_chattools: ^1.0.2
  tom_build_base: ^2.6.21
  # ADDED AT E.11 (Q-E.3.2 strategy 2 / Q-E.3.1 / Q-E.7.1). The OpenAI
  # `/v1/` adapter is mounted as a raw `shelf_router.Router`, NOT via
  # `tom_core_server` annotation classes. Strategy 2 matches the plan's
  # literal "shelf router mounted under /v1/" wording and keeps the bespoke
  # OpenAI wire surface (non-standard SSE framing + custom JSON shapes)
  # self-contained in one adapter file, testable in isolation against
  # captured OpenAI fixtures (E.53). It therefore needs `shelf` +
  # `shelf_router` as DIRECT deps (the alternative — widening the
  # `tom_core_server` barrel to re-export shelf — was rejected at Q-E.3.1 as
  # broader coupling owned by the core-server quest). Pinned to the same
  # versions `tom_core_server` already resolves so the closure is unchanged.
  shelf: ^1.4.2
  shelf_router: ^1.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  # Spec § 16 dev-dep list: `test`, `mocktail`. Mocktail is the workspace
  # convention for one-off interaction assertions; the stateful channel
  # loopbacks decided at E.5 are hand-written doubles (Q-E.5.4), so
  # mocktail is reserved for the narrower mocking the adapters / resolvers
  # need from E.11 onwards. Pulled in at E.7 so the surface is reserved at
  # the dependency-discipline step, not retroactively at first use —
  # mirroring substrate's B.7 mocktail reservation.
  mocktail: ^1.0.0
