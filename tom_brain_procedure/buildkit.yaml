# Tom Build Configuration for tom_brain_procedure.
#
# D4rt bridge generation runs via the standalone `d4rtgen` CLI tool
# (`dart run tom_d4rt_generator:d4rtgen`, or the installed `d4rtgen`
# binary), NOT `dart run build_runner build`. The CLI auto-discovers this
# file's top-level `d4rtgen:` key, deserialising it through the same
# `BridgeConfig.fromJson` / `ModuleConfig.fromJson` path the build_runner
# builder used (`tom_d4rt_generator/lib/src/bridge_config.dart`), so the
# option keys below are identical to the previous `build.yaml` — only the
# file name and the flattened nesting differ (the CLI reads options
# directly under `d4rtgen:`; the builder wrapped them in
# `targets.$default.builders.<key>.options:`). The CLI path is faster and
# more reliable than driving the generator through build_runner.
#
# Generates the D4rt bridge code for the engine's bridge source classes:
#
#   - lib/src/bridges/memory_bridge.dart            -> MemoryBridge
#   - lib/src/bridges/substrate_bridge.dart         -> SubstrateBridge
#   - lib/src/bridges/tool_bridge.dart              -> ToolBridge
#   - lib/src/bridges/mcp_bridge.dart               -> McpBridge
#   - lib/src/bridges/vscode_scripting_bridge.dart  -> VscodeScriptingBridge
#   - lib/src/budget/budget_view.dart               -> BudgetView
#
# Schema provenance (recorded at C.3): every option key below is verified
# against the LIVE builder source -- `tom_d4rt_generator/lib/src/bridge_config.dart`
# (`BridgeConfig.fromJson` / `ModuleConfig.fromJson`) -- NOT the partly-stale
# `doc/bridgegenerator_user_reference.md`. The live schema uses `barrelFiles`
# (plural list), `outputPath`, `helpersImport`, `generateBarrel`/`barrelPath`,
# `generateDartscript`/`dartscriptPath`, and `registrationClass`.
#
# `@D4rtBridged` is NOT used: it does not exist in the d4rt ecosystem (Q-C.3.1).
# Selection is config + barrel driven -- the source files are listed as
# `barrelFiles`, and the generator bridges every class reachable from them.
#
# `excludePatterns` is deliberately OMITTED. The C.3 worked example used
# `excludePatterns: [_bridge.dart]` to stop the generator re-scanning its own
# output, but our source files are themselves named `*_bridge.dart`, so that
# pattern would exclude exactly the classes we want bridged. Because
# `barrelFiles` lists the source files explicitly (no directory glob), the
# generated `*.b.dart` outputs are never auto-discovered, so no exclude pattern
# is needed.
#
# `importedBridges` is deliberately OMITTED (Q-C.3.3): the bridged primitive-API
# signatures stay primitive-typed (`num`/`String`/`bool`/`Map`/`List<Object?>`),
# so the generator never has to bridge the memory/substrate domain-type graph and
# there is no cross-package bridged type to import.
#
# `generateDartscript` is ON (re-enabled by plan-2 item #13a). The generator
# writes `relaxers.b.dart` (no-op stubs when there are no generic-extraction
# sites) and emits `AllBridge.subPackageBarrels()`, so the generated
# `dartscript.b.dart` compiles. The generated `BrainBridges.register` (in
# `dartscript.b.dart`) registers every bridge under each `barrelFiles` URI plus
# the `subPackageBarrels()` URIs. The host-owned `bridge_libraries.dart`
# (`BridgeLibraries.*Library`) keeps the canonical `package:` URIs the host
# injects globals under and the validator allow-lists against — injection wiring,
# distinct from the generated registration.

project_id: TBPROC
name: tom_brain_procedure

d4rtgen:
  name: tom_brain_procedure
  # Every path below is inside the existing `bridges/` folder, so generation
  # adds no `lib/src/` subfolder outside the C.8 engine inventory. `d4rtgen`
  # writes exactly four `*.b.dart` files: `barrelPath`, `dartscriptPath`, the
  # module's `outputPath` and `relaxers.b.dart` beside that output.
  # `libraryPath` is not set: only the build_runner builder reads it.
  helpersImport: package:tom_d4rt/tom_d4rt.dart
  generateBarrel: true
  barrelPath: lib/src/bridges/d4rt_bridges.b.dart
  generateDartscript: true
  dartscriptPath: lib/src/bridges/dartscript.b.dart
  registrationClass: BrainBridges
  modules:
    - name: all
      barrelFiles:
        - package:tom_brain_procedure/src/bridges/memory_bridge.dart
        - package:tom_brain_procedure/src/bridges/substrate_bridge.dart
        - package:tom_brain_procedure/src/bridges/tool_bridge.dart
        - package:tom_brain_procedure/src/bridges/mcp_bridge.dart
        - package:tom_brain_procedure/src/bridges/vscode_scripting_bridge.dart
        - package:tom_brain_procedure/src/budget/budget_view.dart
      outputPath: lib/src/bridges/brain_bridges.b.dart
