include: package:lints/recommended.yaml

analyzer:
  exclude:
    # `scripts/` holds d4rt procedure *sources*, not compiled Dart. They are
    # loaded as strings and run on the sandboxed host, where the bridges
    # inject the `mem` / `sub` globals and register the bridge libraries the
    # scripts import (`memory_bridge.dart`, `procedure_inputs.dart`). The
    # static analyzer cannot see those injections, so it would flag every
    # bridged call and bridge-library import as an error. Exclude the tree
    # from analysis; correctness is proven by the engine/host test suites
    # that execute the scripts. (See Q-D.37.2.)
    - scripts/**
    # Generated D4rt bridge barrels (`*.b.dart`) are machine-authored by
    # `tom_d4rt_generator` and regenerated by its `d4rtgen` CLI, so hand-edits
    # do not survive. Their lint cleanliness is owned upstream by the
    # generator, not this package: generator 1.9.0 emits
    # `Future.value(<void callback>)` for void interpreter callbacks, which
    # trips the `void_checks` info. Exclude the generated outputs from static
    # analysis; their correctness is proven by the bridge/host test suites
    # that register and exercise them. (See plan item 1 / tom_d4rt_generator.)
    - lib/src/bridges/*.b.dart
