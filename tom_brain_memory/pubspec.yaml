name: tom_brain_memory
description: Self-organizing property-graph memory for Tom Brain — storage, retrieval, cognitive agents, sleep cycles, MCP server, multi-machine sync, backup. Owns the canonical knowledge graph that every Tom Brain component reads from.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.10.8

# Dependency discipline (Plan step A.22, extended at A.32):
#
# Six dependencies were named in the plan. A.32 promotes `yaml` from
# `dev_dependencies` to runtime — the bootstrap-node-type manifest is a
# YAML file shipped with this package and parsed by runtime code in
# `lib/src/nodes/node_type_yaml_loader.dart` (the "YAML manifest loader"
# the plan explicitly calls for in A.32). See Q-A.32.1 for the contract
# change rationale.
#
# Runtime dependencies (in plan + A.32 order):
#
#   - tom_brain_shared    — cross-component vocabulary (NodeId, Vec, Budget,
#                           Result, events, time, version, anchor). The only
#                           Tom-Brain-level library this package imports.
#   - tom_core_agentic    — generic, domain-free agentic building blocks.
#                           `MemoryConfigLoader` routes its YAML field
#                           coercion + `${ENV}` expansion through
#                           `YamlConfigReader`, the consolidation of the
#                           helper block this loader and the substrate
#                           loader grew independently. Depends only on
#                           tom_basics + yaml, so it adds no new transitive
#                           surface that the A.22 contract forbids.
#   - tom_basics          — workspace baseline (UUID, exception types,
#                           TomLogger). `TomLogger` lives here, not in
#                           tom_core_kernel (see Q-A.22.1).
#   - tom_core_kernel     — `TomBean` (the BeanLocator surface the plan
#                           references — see Q-A.22.1 for the naming gap).
#   - tom_core_server     — `TomBearerAuthentication` for the MCP-server
#                           bearer-token check at A.76.
#   - sqlite3             — workspace pin from A.4 (^2.4.0, resolves to
#                           latest v2.x ≤ 2.9.4). FFI `loadExtension` API
#                           required for the vec0 binary at A.50.
#   - dart_mcp            — workspace pin from A.5 (^0.5.0, resolves to
#                           0.5.1). Server side at A.75 (read-only seven
#                           tools). todo #3 adds a Streamable HTTP/HTTPS
#                           transport (`McpHttpServer`) built on
#                           `dart:io`'s `HttpServer` (SDK, not a new
#                           package) for the cross-machine topology; the
#                           `http`/`dio` exclusion below still holds —
#                           memory does no *outbound* HTTP.
#   - yaml                — promoted from dev at A.32. The bootstrap
#                           manifest (`lib/src/nodes/bootstrap_node_types.yaml`)
#                           is parsed by runtime code so a freshly-booted
#                           memory instance can register the 21 bootstrap
#                           types without going through a code-generation
#                           step. Pinned to `^3.1.2` (the dev-dep version
#                           that was in place pre-A.32).
#
# Explicitly NOT here (plan step A.22 — "No HTTP client, no JWT, no
# logger."):
#
#   - http / dio          — memory does no *outbound* network I/O. Web
#                           fetches are a substrate / access concern. The
#                           inbound Streamable-HTTP MCP server transport
#                           (todo #3) uses `dart:io`'s `HttpServer`, which
#                           is in the SDK, so it adds no package here.
#   - jose / dart_jsonwebtoken / openid_client — token validation is the
#                           caller's responsibility. `TomBearerAuthentication`
#                           is consumed for principal handling, not JWT
#                           parsing.
#   - logger / logging    — the `tomLog` instance from tom_basics is the
#                           only log surface. No second logger is permitted
#                           in this package.
#
# The dependency-discipline test (`test/dependency_surface_test.dart`)
# enforces this contract at build time.
dependencies:
  tom_brain_shared:
    path: ../tom_brain_shared
  tom_core_agentic:
    path: ../../tom_ai/core_extension/tom_core_agentic
  # tom_basics is published to pub.dev; mixing a path dep on tom_basics
  # with a path dep on tom_core_kernel (which itself declares
  # `tom_basics: any` → hosted) is rejected by the pub solver. The
  # convention `tom_brain_shared` uses — hosted constraint — is the one
  # that keeps the dependency graph internally consistent across the
  # workspace. The local edit to tom_basics still flows through, because
  # tom_basics's published version matches what's on disk for the
  # workspace's Phase A timeline.
  tom_basics: ">=1.0.0"
  tom_core_kernel:
    path: ../../tom_ai/core/tom_core_kernel
  tom_core_server:
    path: ../../tom_ai/core/tom_core_server
  sqlite3: ^2.4.0
  dart_mcp: ^0.5.0
  yaml: ^3.1.2
  # A.75 — surfaced as direct deps because `mcp_transports.dart` and the
  # A.75 conformance test import them explicitly (StreamChannel,
  # StreamSinkTransformer). They were already pulled in transitively
  # through `dart_mcp`; the lint `depend_on_referenced_packages` requires
  # them in our pubspec when our own source imports them.
  async: ^2.13.0
  stream_channel: ^2.1.4
  # A.76 — `tom_brain_memory_mcp_server.dart` translates `BearerAuthFailure`
  # into a JSON-RPC error (`RpcException`) when the `initialize` handshake
  # cannot accept a token. Pulled in transitively through `dart_mcp`
  # (which itself uses json_rpc_2 for the wire layer); surfaced here so
  # `depend_on_referenced_packages` stays satisfied.
  json_rpc_2: '>=3.0.3 <5.0.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
